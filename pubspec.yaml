name: task_tracker_app
description: "Planner — a Tasks, Habits & Goals app built with Flutter and Supabase."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Backend: Auth + Postgres
  supabase_flutter: ^2.5.9

  # Charts (Analytics screen)
  fl_chart: ^0.68.0

  # Icons
  cupertino_icons: ^1.0.8

  # Dates
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # assets:
  #   - assets/images/
